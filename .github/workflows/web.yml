# Publie la version web (pour iPhone) sur GitHub Pages à chaque mise à jour de la branche master.
# À activer une fois : Settings → Pages → Source : « GitHub Actions ».
name: Version web

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags et historique : version affichée dans l'app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Modèle de reconnaissance des plats (21 Mo) : seulement pour la version web (iPhone) ;
      # l'app Android a déjà le sien dans ses fichiers.
      - run: mkdir -p dist/food && cp android/app/src/main/assets/food/aiy_food_v1.tflite android/app/src/main/assets/food/LICENCE-MODELE.txt dist/food/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
