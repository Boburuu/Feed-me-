<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : l'app occupe tout l'écran sur iPhone (encoche gérée en CSS). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Feed Me — suivi nutrition, hydratation, activité et poids" />
    <meta name="theme-color" content="#226b5a" />
    <!-- Version web installable (iPhone : Partager → Sur l'écran d'accueil). -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Feed Me" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" href="./favicon.svg" />
    <title>Feed Me</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Téléphone tourné à l'horizontale : Android reste en portrait, mais Safari (iPhone) ne peut pas être bloqué. -->
    <div class="rotate-hint" aria-hidden="true">
      <span class="rotate-hint-icon">📱</span>
      <p>Tournez le téléphone à la verticale pour utiliser Feed Me.</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
